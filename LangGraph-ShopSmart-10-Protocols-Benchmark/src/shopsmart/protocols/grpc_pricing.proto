syntax = "proto3";

package shopsmart.pricing;

service PricingService {
  rpc GetPrice (PriceRequest) returns (PriceResponse);
}

message PriceRequest {
  string product_id = 1;
}

message PriceResponse {
  string product_id = 1;
  double price = 2;
  string currency = 3;
  string stock_status = 4;
}
